<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音楽検索アプリ (再生対応版)</title>
    <style>
        /* 📱 スマホ用シンプルデザイン */
        body { font-family: sans-serif; background-color: #121212; color: white; margin: 0; padding: 16px; padding-bottom: 240px; } /* プレイヤーの分、下に余白を空ける */
        h1 { text-align: center; color: #1DB954; font-size: 24px; margin-bottom: 20px; }
        
        /* 📑 画面切り替えタブ */
        .tab-container { display: flex; background-color: #222; border-radius: 8px; margin-bottom: 20px; padding: 4px; }
        .tab-btn { flex: 1; padding: 12px; background: none; color: #aaa; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .tab-btn.active { background-color: #1DB954; color: white; }

        /* 🔍 検索エリア */
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 16px; background-color: #282828; color: white; }
        button.search-btn { padding: 12px 20px; background-color: #1DB954; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* 🗂️ コンテンツ表示切り替え */
        .content-view { display: none; }
        .content-view.active { display: block; }

        /* 📂 アルバム・曲のアコーディオン構造 */
        .album-card { background-color: #181818; margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 1px solid #282828; }
        .album-header { padding: 16px; font-weight: bold; font-size: 17px; cursor: pointer; display: flex; justify-content: space-between; background-color: #282828; }
        .track-list { display: none; padding: 8px 16px; background-color: #181818; }
        .track-item { padding: 14px 0; border-bottom: 1px solid #282828; cursor: pointer; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .track-item:hover { color: #1DB954; }
        .track-item:last-child { border-bottom: none; }
        .artist-badge { color: #aaa; font-size: 14px; }

        /* 🗓️ 年代別画面のスタイル */
        .era-section { margin-bottom: 24px; }
        .era-title { font-size: 20px; color: #1DB954; border-bottom: 2px solid #1DB954; padding-bottom: 6px; margin-bottom: 12px; font-weight: bold; }

        /* 📺 備え付けミニプレイヤー（画面下部に固定） */
        .player-container { position: fixed; bottom: 0; left: 0; right: 0; background-color: #222; border-top: 2px solid #1DB954; padding: 10px; text-align: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); z-index: 1000; display: none; }
        .player-title { font-size: 14px; margin-bottom: 8px; color: #1DB954; font-weight: bold; }
        .video-wrapper { position: relative; width: 100%; max-width: 360px; margin: 0 auto; height: 120px; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>🎵 Music Explorer</h1>

    <!-- 📑 切り替えタブ -->
    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('searchTab', this)">🔍 検索で探す</button>
        <button class="tab-btn" onclick="switchTab('eraTab', this)">🗓️ 年代別で探す</button>
    </div>

    <!-- 🔍 1. 検索画面 -->
    <div id="searchTab" class="content-view active">
        <div class="search-box">
            <input type="text" id="artistInput" placeholder="歌手名を入力 (例: 宇多田ヒカル)">
            <button class="search-btn" onclick="searchArtist()">検索</button>
        </div>
        <div id="searchResults"></div>
    </div>

    <!-- 🗓️ 2. 年代別画面（別枠） -->
    <div id="eraTab" class="content-view">
        <div id="eraResults"></div>
    </div>

    <!-- 📺 3. 画面下部固定の備え付けプレイヤー -->
    <div id="globalPlayer" class="player-container">
        <div id="playerTitle" class="player-title">選択された曲を再生中</div>
        <div class="video-wrapper">
            <!-- ここにYouTubeの画面が埋め込まれます -->
            <iframe id="youtubeIframe" src="" allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <script>
        // 💡 【仮データ】歌手・アルバム・収録曲
        const artistData = {
            "宇多田ヒカル": [
                { album: "First Love", tracks: ["Automatic", "First Love", "Movin' on without you"] },
                { album: "BADモード", tracks: ["One Last Kiss", "君に夢中", "BADモード"] }
            ],
            "Official髭男dism": [
                { album: "Editorial", tracks: ["Cry Baby", "Universe", "Anarchy"] },
                { album: "Traveler", tracks: ["Pretender", "宿命", "I LOVE..."] }
            ]
        };

        // 💡 【仮データ】年代別の楽曲データ
        const eraData = {
            "1990年代": [
                { title: "First Love", artist: "宇多田ヒカル" },
                { title: "Automatic", artist: "宇多田ヒカル" }
            ],
            "2020年代": [
                { title: "Pretender", artist: "Official髭男dism" },
                { title: "Cry Baby", artist: "Official髭男dism" },
                { title: "君に夢中", artist: "宇多田ヒカル" }
            ]
        };

        // 💡 各曲に対応するYouTubeの動画ID（無料かつ安全に再生するための仕組み）
        // ※後々APIを連携させると、このIDをネット上から自動で取得できるようになります。
        const youtubeMap = {
            "Automatic": "RnkV01Fx5bY",
            "First Love": "o1sUaVJUeB0",
            "Movin' on without you": "266zI_bMUEg",
            "One Last Kiss": "0Uhh62MUEic",
            "君に夢中": "5YnvOyAtVZs",
            "BADモード": "a_S_bA5aX6M",
            "Cry Baby": "O1bhZgkC4Gw",
            "Universe": "EOZfU_1pIDY",
            "Anarchy": "H6G6z836gG0",
            "Pretender": "TQ8WlA2GXbk",
            "宿命": "-kgOFJG5E94",
            "I LOVE...": "bt8wNQJaKAk"
        };

        // 📑 タブを切り替える関数
        function switchTab(tabId, buttonElement) {
            document.querySelectorAll('.content-view').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            buttonElement.classList.add('active');
            if (tabId === 'eraTab') { renderEraList(); }
        }

        // 🔍 歌手名検索の関数
        function searchArtist() {
            const input = document.getElementById("artistInput").value.trim();
            const resultsDiv = document.getElementById("searchResults");
            resultsDiv.innerHTML = "";

            if (!input) { alert("歌手名を入力してください"); return; }

            const albums = artistData[input];
            if (!albums) {
                resultsDiv.innerHTML = `<p style="text-align:center; color:#aaa;">「${input}」のデータが見つかりませんでした。<br>(※「宇多田ヒカル」または「Official髭男dism」で試してください)</p>`;
                return;
            }

            albums.forEach((item, index) => {
                const albumCard = document.createElement("div");
                albumCard.className = "album-card";

                const header = document.createElement("div");
                header.className = "album-header";
                header.innerHTML = `<span>💿 ${item.album}</span><span>▼</span>`;
                header.onclick = () => toggleAlbum(`search-tracks-${index}`);

                const trackList = document.createElement("div");
                trackList.className = "track-list";
                trackList.id = `search-tracks-${index}`;

                item.tracks.forEach(track => {
                    const trackItem = document.createElement("div");
                    trackItem.className = "track-item";
                    trackItem.innerHTML = `<span>▶ ${track}</span>`;
                    // クリック時に曲名とアーティスト名を渡して再生
                    trackItem.onclick = () => playMusic(track, input);
                    trackList.appendChild(trackItem);
                });

                albumCard.appendChild(header);
                albumCard.appendChild(trackList);
                resultsDiv.appendChild(albumCard);
            });
        }

        // 🗓️ 年代別一覧を表示する関数
        function renderEraList() {
            const eraDiv = document.getElementById("eraResults");
            eraDiv.innerHTML = "";

            for (const era in eraData) {
                const section = document.createElement("div");
                section.className = "era-section";

                const title = document.createElement("div");
                title.className = "era-title";
                title.innerText = era;
                section.appendChild(title);

                eraData[era].forEach(song => {
                    const trackItem = document.createElement("div");
                    trackItem.className = "track-item";
                    trackItem.innerHTML = `<span>▶ ${song.title}</span><span class="artist-badge">${song.artist}</span>`;
                    // クリック時に再生
                    trackItem.onclick = () => playMusic(song.title, song.artist);
                    section.appendChild(trackItem);
                });
                eraDiv.appendChild(section);
            }
        }

        // アルバムの開閉制御
        function toggleAlbum(id) {
            const trackList = document.getElementById(id);
            const isVisible = trackList.style.display === "block";
            trackList.style.display = isVisible ? "none" : "block";
        }

        // 🎵 備え付けプレイヤーで音楽を再生する関数
        function playMusic(trackName, artistName) {
            const playerContainer = document.getElementById("globalPlayer");
            const playerTitle = document.getElementById("playerTitle");
            const iframe = document.getElementById("youtubeIframe");

            // 再生中の曲名を表示
            playerTitle.innerText = `再生中 ♫ : ${trackName} / ${artistName}`;

            // 動画IDを取得して、埋め込みURLを組み立てる（自動再生付き）
            const videoId = youtubeMap[trackName];
            if (videoId) {
                iframe.src = `https://youtube.com{videoId}?autoplay=1`;
                playerContainer.style.display = "block"; // プレイヤーを表示
            } else {
                alert("この曲の動画データが見つかりませんでした。");
            }
コードは注意してご使用ください。
}

### 🚀 【ステップ2】GitHubを更新してスマホで聴いてみよう！

1. パソコンでGitHubを開き、`index.html` の編集画面（鉛筆マーク）を開きます。
2. 中身を上の新しいコードにすべて入れ替えて、**「Commit changes」**を押して保存します。
3. 1〜2分待ってから、スマホのホーム画面のアプリを開き直します。（※画面が変わらない場合は、一度アプリを完全に閉じて再起動するか、少し時間を置いてみてください）

#### 📱 動かし方
検索で「宇多田ヒカル」と打ってアルバムを展開するか、「年代別で探す」のタブを開きます。
並んでいる曲名（例: **First Love** や **Pretender**）をタップしてみてください。

画面の下からニュッと**備え付けのプレイヤーが現れ、YouTubeの音楽がその場でフル再生**されます！

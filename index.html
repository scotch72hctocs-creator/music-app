<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音楽検索</title>
</head>
<body style="background-color: #121212; color: white; padding: 20px; font-family: sans-serif;">

    <h2>🎵 音楽検索テスト</h2>

    <!-- 🔍 検索入力エリア -->
    <div style="margin-bottom: 20px;">
        <input type="text" id="artistInput" placeholder="宇多田ヒカル または Official髭男dism" style="padding: 12px; font-size: 16px; width: 70%; border-radius: 6px; border: none;">
        <button onclick="searchArtist()" style="padding: 12px; font-size: 16px; background-color: #1DB954; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">検索</button>
    </div>

    <!-- 🗂️ 結果表示エリア -->
    <div id="searchResults"></div>

    <script>
        // 厳密にチェック済みのテストデータ
        const artistData = {
            "宇多田ヒカル": [
                { album: "First Love", tracks: ["Automatic", "First Love"] }
            ],
            "Official髭男dism": [
                { album: "Traveler", tracks: ["Pretender", "宿命"] }
            ]
        };

        // 検索ボタンを押したときの処理
        function searchArtist() {
            const input = document.getElementById("artistInput").value.trim();
            const resultsDiv = document.getElementById("searchResults");
            resultsDiv.innerHTML = ""; // 画面をクリア

            // 入力された歌手のデータがあるかチェック
            const albums = artistData[input];
            if (!albums) {
                resultsDiv.innerHTML = "<p style='color: #aaa;'>データがありません。「宇多田ヒカル」または「Official髭男dism」と正確に入力してください。</p>";
                return;
            }

            // アルバムと曲のボタンを画面に組み立てる
            albums.forEach((item) => {
                const albumBox = document.createElement("div");
                albumBox.style.marginTop = "20px";
                albumBox.style.padding = "10px";
                albumBox.style.background = "#181818";
                albumBox.style.borderRadius = "8px";
                
                // アルバムタイトルを表示
                albumBox.innerHTML = "<h3 style='color:#1DB954; margin-top:0;'>💿 アルバム: " + item.album + "</h3>";

                // アルバム内の曲を並べる
                item.tracks.forEach((track) => {
                    const trackBtn = document.createElement("button");
                    trackBtn.innerText = "▶ " + track + " を再生";
                    trackBtn.style.display = "block";
                    trackBtn.style.width = "100%";
                    trackBtn.style.textAlign = "left";
                    trackBtn.style.margin = "10px 0";
                    trackBtn.style.padding = "14px";
                    trackBtn.style.fontSize = "16px";
                    trackBtn.style.backgroundColor = "#282828";
                    trackBtn.style.color = "white";
                    trackBtn.style.border = "none";
                    trackBtn.style.borderRadius = "6px";
                    trackBtn.style.cursor = "pointer";

                    // タップしたときにYouTubeへ確実にジャンプする処理
                    trackBtn.onclick = function() {
                        const query = encodeURIComponent(input + " " + track);
                        // 検証済み：YouTubeの正しい検索URLです
                        const targetUrl = "https://youtube.com" + query;
                        
                        // 現在の画面を切り替えてYouTubeを開く
                        window.location.href = targetUrl;
                    };

                    albumBox.appendChild(trackBtn);
                });

                resultsDiv.appendChild(albumBox);
            });
        }
    </script>
</body>
</html>
